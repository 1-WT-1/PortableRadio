[General]
; Set to true to print debug messages to the console
Debug = false

[Keybinds]
; Use Unreal Engine key names (e.g. F5, Add, Subtract, Up, Down, LeftShift, etc.)
; Visual key list: https://unrealcommunity.wiki/list-of-key/gamepad-input-names-j9c5mqou
; You can combine keys with modifiers using '+' (e.g. VolumeUpKey = LeftShift+Add, ToggleKey = LeftControl+F5)
; Supported modifiers: LeftShift, RightShift, LeftControl, RightControl, LeftAlt, RightAlt (or Shift, Ctrl, Alt)
; Leave blank or set to None to disable
ToggleKey     = F5
VolumeUpKey   = Add
VolumeDownKey = Subtract
NextTrackKey  = F4

[Audio]
; Play sound when turning the radio on or off
EnableToggleSound = true
ToggleSoundVolume = 1.0

; Radio volume multiplier (0.0 to 2.0). Automatically saved when adjusted in-game
DefaultVolume = 1.0
; Volume change step per key press (0.01 to 0.20)
VolumeStep = 0.05

[HUD]
; Set to true to show the radio widget on the HUD
ShowHUD = true

; Set to true to show the radio widget even with no HUD
; Set to false to require HUD
ShowWithoutEquippedHUD = false

; Automatically hide the widget when the radio is powered off
AutoHideWhenOff = true

; Duration in seconds to display "RADIO ON" / "RADIO OFF" before fading
TransitionDuration = 1.0

; Fade animation duration in seconds
FadeDuration = 0.3

[VolumeSlider]
; Show volume bar beneath song title when volume is adjusted
ShowVolumeSlider = true
; Duration in seconds to display volume slider before auto-hiding
SliderHideDelay = 1.5
; Width and height of the volume progress bar in pixels
SliderWidth = 260.0
SliderHeight = 10.0

[Text]
; Font size of the radio status and song title
FontSize = 18

; Enable marquee / scrolling text for long song titles
EnableMarquee = true
; Maximum visible character window length
MaxVisibleCharacters = 24
; Characters shifted per second
MarqueeSpeed = 3.0

[Icon]
; Show note.png icon next to the song title
ShowIcon = true
; Icon dimensions in pixels
IconSize = 14.0
; Spacing between icon and song title
IconSpacing = 6.0

[Position]
; Screen anchor: BottomLeft, Center, TopLeft, TopRight, BottomRight, TopCenter, BottomCenter
Anchor = BottomLeft
; X and Y pixel offsets from anchor position
OffsetX = 108.0
OffsetY = -148.0
